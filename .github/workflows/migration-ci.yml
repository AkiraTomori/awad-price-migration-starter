name: Migration smoke CI

on:
  push:
    branches:
      - main
      - 'docs/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Tests and fresh SQLite migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: ${{ runner.temp }}/ia2-smoke.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Compatibility tests load the original starter source and v1 tag.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Node version
        run: node --version

      - name: Application tests
        run: npm test

      - name: Apply migrations on disposable database
        run: npm run migrate

      - name: Seed data
        run: npm run seed

      - name: Check data and schema consistency
        run: npm run check

      - name: Show applied schema migrations
        run: npm run migrate:status

# Scope: fast CI only. It does not start two servers, inject steady traffic,
# test rolling restarts, or prove zero downtime. See docs/AGENT_WORKFLOW.md.
